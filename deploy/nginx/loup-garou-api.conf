# Mod?le HTTP avant Certbot. Adapter server_name et le port ? .env.
# Nginx est install? sur le VPS, pas dans Docker.
server {
    listen 80;
    server_name loup-garou.bouchard-mehdi.fr;
    client_max_body_size 64k;

    location /api/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        # Sup?rieur au total pingInterval + pingTimeout de Socket.IO.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        return 404;
    }
}
