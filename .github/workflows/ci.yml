name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ORIGIN: http://localhost:3009
      POSTGRES_PASSWORD: ci-validation-only-not-a-production-secret
      IMAGE_TAG: ci
      NODE_ENV: development
      SESSION_SECRET: ci-only-session-secret-never-use-in-production
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run prisma:validate
      - run: npm audit --omit=dev --audit-level=high
      - name: Check shared instructions
        working-directory: .
        run: cmp AGENTS.md CLAUDE.md
      - name: Validate Compose
        working-directory: .
        run: docker compose --profile test config --quiet
      - name: Build production image
        working-directory: .
        run: docker compose --profile test build api migrate integration
      - name: Smoke test with PostgreSQL and Redis
        working-directory: .
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:3009/api/ready
      - name: Test accounts with real PostgreSQL and Redis
        working-directory: .
        run: |
          docker compose exec -T api node --input-type=module < back/tests/smoke/auth.mjs
      - name: Integration tests inside Docker
        working-directory: .
        run: docker compose --profile test run --rm integration
      - name: Container logs
        if: failure()
        working-directory: .
        run: docker compose logs --tail=100
      - name: Stop CI containers
        if: always()
        working-directory: .
        run: docker compose down
